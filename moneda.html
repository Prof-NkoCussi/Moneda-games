<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Cara o Seca</title>
<style>
  :root { --bg:#12151c; --card:#1c212b; --txt:#f2f2f2; --muted:#9aa3b2; --oro:#2ec4b6; --oro2:#138a80; --plata:#d9dee6; --plata2:#9aa3b2; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  body { min-height:100vh; background:var(--bg); color:var(--txt); font-family:system-ui,-apple-system,sans-serif;
         display:flex; flex-direction:column; align-items:center; padding:24px 16px; gap:22px; }
  h1 { font-size:1.8rem; letter-spacing:1px; }
  .lados { width:100%; max-width:420px; display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .lado { background:var(--card); border-radius:14px; padding:12px; display:flex; flex-direction:column; gap:8px; }
  .lado h2 { font-size:1rem; text-align:center; }
  .lado.cara h2 { color:var(--oro); } .lado.seca h2 { color:var(--plata); }
  input { width:100%; padding:10px; border-radius:10px; border:1px solid #333a47; background:#12151c;
          color:var(--txt); font-size:16px; }
  input:focus { outline:none; border-color:var(--oro); }

  .escena { perspective:900px; width:170px; height:170px; margin-top:6px; }
  .moneda { width:100%; height:100%; position:relative; transform-style:preserve-3d; }
  .cara-m, .seca-m { position:absolute; inset:0; border-radius:50%; backface-visibility:hidden;
          display:flex; flex-direction:column; align-items:center; justify-content:center; font-weight:800;
          font-size:1.4rem; text-align:center; padding:18px; }
  .cara-m { background:radial-gradient(circle at 35% 30%, #a8f0e8, var(--oro) 45%, var(--oro2)); color:#063d38;
          border:6px solid var(--oro2); }
  .seca-m { background:radial-gradient(circle at 35% 30%, #fff, var(--plata) 45%, var(--plata2)); color:#2b313b;
          border:6px solid var(--plata2); transform:rotateY(180deg); }
  .cara-m small, .seca-m small { font-size:.75rem; font-weight:600; margin-top:4px; opacity:.8; word-break:break-word; }

  .girando-cara { animation:giroCara 1.6s cubic-bezier(.2,.7,.3,1) forwards; }
  .girando-seca { animation:giroSeca 1.6s cubic-bezier(.2,.7,.3,1) forwards; }
  @keyframes giroCara { 0%{transform:translateY(0) rotateY(0)} 50%{transform:translateY(-90px) rotateY(1080deg)} 100%{transform:translateY(0) rotateY(1800deg)} }
  @keyframes giroSeca { 0%{transform:translateY(0) rotateY(0)} 50%{transform:translateY(-90px) rotateY(1170deg)} 100%{transform:translateY(0) rotateY(1980deg)} }

  button { background:#7b61ff; color:#fff; border:none; border-radius:999px; padding:14px 42px;
           font-size:1.15rem; font-weight:800; cursor:pointer; box-shadow:0 4px 0 #5540d1; }
  button:active { transform:translateY(3px); box-shadow:0 1px 0 #5540d1; }
  button:disabled { opacity:.5; }
  .resultado { min-height:70px; text-align:center; font-size:1.3rem; font-weight:700; }
  .resultado span { display:block; font-size:1rem; color:var(--muted); font-weight:500; margin-top:4px; }
  .marcador { color:var(--muted); font-size:.95rem; }
</style>
</head>
<body>
  <h1>🪙 Cara o Seca</h1>

  <div class="lados">
    <div class="lado cara">
      <h2>CARA</h2>
      <input id="c1" placeholder="Palabra" maxlength="20">
    </div>
    <div class="lado seca">
      <h2>SECA</h2>
      <input id="s1" placeholder="Palabra" maxlength="20">
    </div>
  </div>

  <div class="escena">
    <div class="moneda" id="moneda">
      <div class="cara-m">CARA<small id="tc"></small></div>
      <div class="seca-m">SECA<small id="ts"></small></div>
    </div>
  </div>

  <button id="tirar">TIRAR</button>
  <div class="resultado" id="res"></div>
  <div class="marcador" id="marc">Cara 0 · Seca 0</div>

<script>
  const $ = id => document.getElementById(id);
  let nc = 0, ns = 0;
  const palabras = a => $(a).value.trim();

  $('tirar').onclick = () => {
    const pc = palabras('c1'), ps = palabras('s1');
    $('tc').textContent = pc; $('ts').textContent = ps;
    const m = $('moneda'), btn = $('tirar');
    const r = new Uint32Array(1); crypto.getRandomValues(r);
    const esCara = r[0] % 2 === 0;
    btn.disabled = true; $('res').innerHTML = '';
    m.className = 'moneda'; void m.offsetWidth;
    m.classList.add(esCara ? 'girando-cara' : 'girando-seca');
    setTimeout(() => {
      esCara ? nc++ : ns++;
      const pal = esCara ? pc : ps;
      $('res').innerHTML = (esCara ? '¡CARA!' : '¡SECA!') + (pal ? '<span>' + pal.replace(/</g,'&lt;') + '</span>' : '');
      $('marc').textContent = `Cara ${nc} · Seca ${ns}`;
      btn.disabled = false;
    }, 1650);
  };
</script>
</body>
</html>
